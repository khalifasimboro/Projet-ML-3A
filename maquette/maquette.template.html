<meta charset="utf-8">
<title>Ballguard Maquette</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : rail de navigation sombre fixe (porte le logo dans les deux thèmes) + zone de travail qui change de thème. */
:root{
  --bg:#0F1115; --surface:#181B21; --surface2:#20242C; --line:#2D323D; --fg:#F2F3F5; --muted:#9CA3B0;
  --accent:#F27A1F; --accent-soft:rgba(242,122,31,.15); --accent-fg:#FFFFFF;
  --rail:#090A0D; --rail-line:#1D2028; --rail-fg:#D5D9E1; --rail-muted:#7C8492;
  --ok:#3DCB8A; --alarm:#FF5A6A; --warn:#F2B93B;
  --c-safe:#3DCB8A; --c-ball:#5AAEFF; --c-inner:#BC97FF; --c-outer:#F4C653; --c-comb:#FF6B88;
  --shadow:0 1px 0 rgba(255,255,255,.045) inset, 0 14px 34px rgba(0,0,0,.42);
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --body:"Inter","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",Consolas,monospace;
  color-scheme:dark;
}
:root[data-app="light"]{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface2:#F6F7FA; --line:#E0E4EC; --fg:#101A2C; --muted:#5A667B;
  --accent:#D9620B; --accent-soft:rgba(228,110,20,.11);
  --ok:#128A56; --alarm:#D9293B; --warn:#B07A08;
  --c-safe:#17996A; --c-ball:#2B7FD9; --c-inner:#8A5BE0; --c-outer:#C9940F; --c-comb:#E03A5C;
  --shadow:0 1px 2px rgba(16,26,44,.06), 0 8px 24px rgba(16,26,44,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
/* ---- rail ---- */
.rail{background:var(--rail);border-right:1px solid var(--rail-line);display:flex;flex-direction:column;gap:18px;padding:22px 14px 16px;position:sticky;top:0;height:100vh;color:var(--rail-fg)}
.rail .brand{display:flex;justify-content:center;padding:4px 0 10px}
.rail .brand img{width:158px;height:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .group{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted);padding:12px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--rail-fg);text-decoration:none;font-weight:500;font-size:13.5px;border:1px solid transparent}
.nav a svg{width:17px;height:17px;flex:none;opacity:.75}
.nav a:hover{background:#14161C}
.nav a.on{background:linear-gradient(90deg,rgba(228,110,20,.20),rgba(228,110,20,.04));border-color:rgba(228,110,20,.35);color:#fff}
.nav a.on svg{opacity:1;color:#F58A2E}
.rail .model{margin-top:auto;border:1px solid var(--rail-line);border-radius:10px;padding:12px;font-size:12px;color:var(--rail-muted);background:#0F1116}
.rail .model b{display:flex;align-items:center;gap:7px;color:var(--rail-fg);font-weight:600;margin-bottom:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(47,191,127,.18);flex:none}
.dot.red{background:var(--alarm);box-shadow:0 0 0 3px rgba(255,77,94,.18)}
/* ---- main ---- */
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .where{min-width:0;flex:1 1 240px;padding-left:12px}
.top .crumb{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.top h1{font-family:var(--display);font-size:20px;font-weight:600;margin:0;text-wrap:balance}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface);gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.seg button svg{width:14px;height:14px}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.seg.quiet button.on{background:var(--surface2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.page{padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1320px;width:100%}
@media(min-width:900px){.page,.top{padding-left:28px;padding-right:28px}.top .where{padding-left:0}}
.lead{color:var(--muted);max-width:68ch;margin:0}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.split{grid-template-columns:minmax(260px,320px) minmax(0,1fr)}
.split-r{grid-template-columns:minmax(0,1fr) minmax(260px,340px)}
@media(max-width:860px){.split,.split-r{grid-template-columns:minmax(0,1fr)}.g2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:12px}
.card h3{font-family:var(--display);font-size:15px;font-weight:600;margin:0}
.card .sub{color:var(--muted);font-size:12.5px;margin:-8px 0 0}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.kpi{gap:6px}
.kpi .lab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:15px;color:var(--muted);font-weight:500}
.kpi .hint{font-size:12px;color:var(--muted)}
.chart{width:100%;min-height:260px}
.chart.tall{min-height:380px}.chart.short{min-height:200px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:9px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn:hover{border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
select,input[type=range]{font:inherit;color:var(--fg)}
select{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
input[type=range]{accent-color:var(--accent);width:100%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12.5px}
tr.hl td{background:var(--accent-soft)}
.scroll{overflow-x:auto}
/* intro accueil */
.intro{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;padding-block:6px 2px}
.intro h2{font-family:var(--display);font-size:clamp(22px,2.6vw,30px);line-height:1.15;margin:0 0 6px;font-weight:600;text-wrap:balance;max-width:24ch}
.intro h2 em{font-style:normal;color:var(--accent)}
.intro p{color:var(--muted);margin:0;max-width:58ch}
/* cartes de descripteurs (surveillance) */
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fc{position:relative;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 12px 8px;display:flex;flex-direction:column;gap:2px;cursor:default;transition:border-color .15s,transform .15s}
.fc:hover,.fc:focus-visible{border-color:var(--accent);transform:translateY(-2px);z-index:4}
.fc .nm{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.fc .v{font-family:var(--display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.fc.out{border-color:var(--alarm)}.fc.out .v{color:var(--alarm)}
.fc .tag{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.fc.out .tag{color:var(--alarm)}
.fc svg{width:100%;height:30px;display:block;margin-top:2px}
.fc .tip{display:none;position:absolute;left:0;bottom:calc(100% + 8px);min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 12px 30px rgba(0,0,0,.35);font-size:12px}
.fc:hover .tip,.fc:focus-visible .tip{display:block}
.fc .tip b{display:block;font-family:var(--display);font-size:13px;margin-bottom:6px}
.fc .tip div{display:flex;justify-content:space-between;gap:14px;color:var(--muted);padding:2px 0}
.fc .tip div span:last-child{font-family:var(--mono);color:var(--fg)}
/* pipeline */
.pipe{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.pipe .st{flex:1 1 150px;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;min-width:0}
.pipe .st b{display:block;font-family:var(--display);font-size:13.5px}
.pipe .st span{font-size:12px;color:var(--muted)}
.pipe .st code{font-family:var(--mono);font-size:11px;color:var(--accent)}
.pipe .ar{align-self:center;color:var(--muted);flex:none}
.pipe .ar svg{width:16px;height:16px}
@media(max-width:760px){.pipe .ar{display:none}}
.mod{text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.mod:hover{border-color:var(--accent);transform:translateY(-2px)}
.mod .ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mod .ic svg{width:18px;height:18px}
.mod p{margin:0;color:var(--muted);font-size:13px}
/* diagnostic */
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:20px 14px;text-align:center;color:var(--muted);font-size:13px;background:var(--surface2)}
.drop svg{width:26px;height:26px;color:var(--accent);display:block;margin:0 auto 8px}
.drop b{color:var(--fg)}
.verdict{border-radius:14px;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border:1px solid}
.verdict.bad{background:linear-gradient(90deg,rgba(255,77,94,.16),rgba(255,77,94,.03));border-color:rgba(255,77,94,.45)}
.verdict.good{background:linear-gradient(90deg,rgba(47,191,127,.16),rgba(47,191,127,.03));border-color:rgba(47,191,127,.45)}
.verdict .big{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.15}
.verdict .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.verdict.bad .ic{background:var(--alarm);color:#fff}.verdict.good .ic{background:var(--ok);color:#fff}
.verdict .ic svg{width:24px;height:24px}
.verdict .meta{margin-left:auto;display:flex;gap:18px;flex-wrap:wrap}
.verdict .meta div{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.verdict .meta b{display:block;font-family:var(--mono);font-size:15px;color:var(--fg);letter-spacing:0;text-transform:none}
.gauge{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,var(--ok) 0%,var(--ok) 34%,var(--warn) 42%,var(--alarm) 60%,var(--alarm) 100%);margin:26px 0 22px}
.gauge .th{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--fg)}
.gauge .th span,.gauge .mk span{position:absolute;white-space:nowrap;font-size:11px;font-family:var(--mono);transform:translateX(-50%)}
.gauge .th span{top:-18px;color:var(--muted)}
.gauge .mk{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--surface);border:4px solid var(--fg);transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.gauge .mk span{top:20px;font-weight:600}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .b{display:grid;grid-template-columns:118px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:12.5px}
.bars .b span:first-child{font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .tr{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bars .tr i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bars .b span:last-child{text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)}
.log{font-family:var(--mono);font-size:12px;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}
.log div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:7px 9px;border-radius:8px;background:var(--surface2);border-left:3px solid var(--line)}
.log div.a{border-left-color:var(--alarm)}.log div.o{border-left-color:var(--ok)}
.log time{color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:0}
.steps .s{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;padding-bottom:18px;position:relative}
.steps .s:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.steps .n{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.steps b{font-family:var(--display);font-size:14.5px}
.steps p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.note{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.legend{display:flex;gap:8px;flex-wrap:wrap}
.foot{color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.people div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface2);font-weight:600;font-size:13px}
.people span{display:block;font-weight:400;color:var(--muted);font-size:12px}
/* mobile rail */
@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--rail-line)}
  .rail .brand{padding:0}.rail .brand img{width:84px}
  .nav{flex-direction:row}.nav .group,.rail .model{display:none}
  .nav a{white-space:nowrap;padding:8px 10px}
  .top{position:static}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <aside class="rail">
    <a class="brand" href="#accueil"><img src="__LOGO_FULL__" alt="Ballguard"></a>
    <nav class="nav" id="nav"></nav>
    <div class="model" id="modelcard"></div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="where"><div class="crumb" id="crumb"></div><h1 id="ptitle"></h1></div>
      <div class="seg" id="lang" role="group" aria-label="Langue"><button data-l="fr">FR</button><button data-l="en">EN</button></div>
      <div class="seg" id="theme" role="group" aria-label="Thème"><button data-t="dark"></button><button data-t="light"></button></div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script>
const LOGO="__LOGO_FULL__", ICON="__LOGO_ICON__";
const S={lang:'fr',theme:'light',tab:{},ex:2,vit:20,lat:{corr:true,dim:'2d',col:'etat',k:5},exp:{etat:'INNER_RACE',desc:'kurtosis_vb'},sim:{run:false,i:0,pts:[],log:[],ft:[],speed:1,sc:'deg'}};
const T=(fr,en)=>S.lang==='fr'?fr:en;
const I={
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 scan:'<path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M3 12h4l2-4 3 8 2-4h7"/>',
 pulse:'<path d="M2 12h4l3-8 4 16 3-8h6"/>',
 orbit:'<circle cx="12" cy="12" r="2.5"/><circle cx="5" cy="7" r="1.5"/><circle cx="19" cy="8" r="1.5"/><circle cx="7" cy="18" r="1.5"/><circle cx="18" cy="17" r="1.5"/>',
 award:'<path d="M4 20h16M6 20V9l6-5 6 5v11M10 20v-6h4v6"/>',
 book:'<path d="M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2zM4 21V5M9 8h7M9 12h7"/>',
 up:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
 play:'<path d="M7 4v16l13-8z"/>', pause:'<path d="M7 4v16M17 4v16"/>', reset:'<path d="M4 4v6h6M4.5 15a8 8 0 1 0 1.6-8.2L4 10"/>',
 dl:'<path d="M12 4v12M7 11l5 5 5-5M4 20h16"/>', arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 alert:'<path d="M12 3 2 20h20zM12 10v5M12 17.5v.5"/>', check:'<path d="m5 12 5 5 9-10"/>',
 moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>', sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>'
};
const ic=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const ETATS=['SAFE','BALL','INNER_RACE','OUTER_RACE','COMBINED'];
const ENOM=e=>({SAFE:T('Sain','Healthy'),BALL:T('Défaut de bille','Ball fault'),INNER_RACE:T('Bague intérieure','Inner race'),OUTER_RACE:T('Bague extérieure','Outer race'),COMBINED:T('Défaut combiné','Combined fault')})[e];
const CV={SAFE:'--c-safe',BALL:'--c-ball',INNER_RACE:'--c-inner',OUTER_RACE:'--c-outer',COMBINED:'--c-comb'};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const col=e=>css(CV[e]);
const PAGES=[
 ['accueil','home',()=>T('Accueil','Home'),()=>T('Vue d\'ensemble','Overview')],
 ['exploration','chart',()=>T('Exploration des données','Data exploration'),()=>T('Données','Data')],
 ['diagnostic','scan',()=>T('Diagnostic d\'un signal','Signal diagnosis'),()=>T('Analyse','Analysis')],
 ['surveillance','pulse',()=>T('Surveillance en continu','Live monitoring'),()=>T('Analyse','Analysis')],
 ['latent','orbit',()=>T('Espace latent et clustering','Latent space & clustering'),()=>T('Modèles','Models')],
 ['performances','award',()=>T('Performances des modèles','Model performance'),()=>T('Modèles','Models')],
 ['methodologie','book',()=>T('Méthodologie et à propos','Methodology & about'),()=>T('Projet','Project')]
];
/* RNG déterministe pour les courbes illustratives */
function rng(seed){let s=seed;return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
function gauss(r){return Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.283*r())}
function lay(x={}){const fg=css('--fg'),mu=css('--muted'),ln=css('--line');
 const ax={gridcolor:ln,zerolinecolor:ln,linecolor:ln,tickfont:{color:mu,size:11},title:{font:{color:mu,size:12}}};
 const o={paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',font:{family:'Inter, sans-serif',color:fg,size:12},margin:{l:48,r:14,t:10,b:40},
  legend:{orientation:'h',y:-0.22,font:{color:mu,size:11}},hoverlabel:{bgcolor:css('--surface2'),bordercolor:ln,font:{color:fg}},xaxis:{...ax},yaxis:{...ax}};
 for(const k in x){o[k]=(k==='xaxis'||k==='yaxis')?{...ax,...x[k],title:{text:x[k].title||'',font:{color:mu,size:12}}}:x[k]}
 return o}
function P(id,tr,l){const el=document.getElementById(id);if(el&&window.Plotly)Plotly.react(el,tr,lay(l),{displayModeBar:false,responsive:true})}
function sig(etat,n=500,seed=7){const r=rng(seed+ETATS.indexOf(etat)*13),amp={SAFE:.22,BALL:.09,INNER_RACE:.35,OUTER_RACE:.3,COMBINED:.5}[etat],per={SAFE:0,BALL:83,INNER_RACE:47,OUTER_RACE:61,COMBINED:33}[etat],pk={SAFE:0,BALL:.45,INNER_RACE:2.2,OUTER_RACE:1.9,COMBINED:3}[etat];
 const y=[];for(let i=0;i<n;i++){let v=amp*(.6*Math.sin(i*.31)+.4*Math.sin(i*.77)+.5*gauss(r));if(per){const d=i%per;v+=pk*Math.exp(-d/5)*Math.cos(d*1.9)*(.7+.6*r())}y.push(v)}return y}
function spec(etat,seed=3){const r=rng(seed+ETATS.indexOf(etat)),lift={SAFE:0,BALL:.3,INNER_RACE:1.5,OUTER_RACE:1.3,COMBINED:2}[etat],x=[],y=[];
 for(let f=.05;f<=12.8;f+=.05){let v=-6.2+lift-.12*f+1.3*Math.exp(-((f-2.4)**2)/.6)+1.1*Math.exp(-((f-7.1)**2)/1.4)*(lift>0?1.4:.6);if(etat==='SAFE')for(const p of[3,6,12])v+=1.6*Math.exp(-((f-p)**2)/.004);v+=.12*gauss(r);x.push(+f.toFixed(2));y.push(Math.pow(10,v))}return{x,y}}

const FEATS=[['rms_vb',.21,.48,.17,.27,3,'g'],['kurtosis_vb',2.3,11,1.9,3.2,2,''],['crete_vb',3.4,9,2.8,4.4,2,''],['pkpk_vb',1.3,5.5,1,1.8,2,'g'],['bande4_vb',-4.6,-3.1,-4.9,-4.3,2,'log'],['bande6_vb',-5,-3.3,-5.3,-4.7,2,'log'],['rms_v',.09,.2,.07,.12,3,'g'],['kurtosis_v',2.5,8,2,3.4,2,'']];
function featCard(f,k){const h=S.sim.ft.map(r=>r[k]),n=h.length,v=n?h[n-1]:null,out=v!==null&&(v<f[3]||v>f[4]),fm=x=>x.toFixed(f[5]).replace('.',S.lang==='fr'?',':'.');
 let sp='';if(n>1){const lo=Math.min(f[3],...h),hi=Math.max(f[4],...h),Y=x=>27-(x-lo)/(hi-lo||1)*24,q=h.slice(-60),X=i=>i/(q.length-1)*100;
  sp=`<rect x="0" y="${Y(f[4])}" width="100" height="${Math.max(1,Y(f[3])-Y(f[4]))}" fill="var(--ok)" opacity=".13"/><polyline fill="none" stroke="${out?'var(--alarm)':'var(--accent)'}" stroke-width="1.6" vector-effect="non-scaling-stroke" points="${q.map((x,i)=>X(i).toFixed(1)+','+Y(x).toFixed(1)).join(' ')}"/>`}
 return `<div class="fc ${out?'out':''}" tabindex="0"><div class="nm"><span>${f[0]}</span><span>${f[6]}</span></div><div class="v">${v===null?'—':fm(v)}</div><div class="tag">${v===null?'&nbsp;':out?T('hors plage','out of range'):T('normal','normal')}</div>
 <svg viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">${sp}</svg>
 <div class="tip"><b>${f[0]}</b><div><span>${T('Valeur actuelle','Current value')}</span><span>${v===null?'—':fm(v)}</span></div><div><span>${T('Plage saine','Healthy range')}</span><span>${fm(f[3])} – ${fm(f[4])}</span></div><div><span>${T('Min / max de la série','Series min / max')}</span><span>${n?fm(Math.min(...h))+' / '+fm(Math.max(...h)):'—'}</span></div><div><span>${T('Écart au sain','Gap to healthy')}</span><span>${v===null?'—':(v>=f[1]?'+':'')+Math.round((v-f[1])/Math.abs(f[1])*100)+' %'}</span></div></div></div>`}
function drawSim(){const s=S.sim,x=s.pts.map((_,i)=>i+1),n=s.pts.length,bad=n&&s.pts[n-1]>SEUIL,t=Array.from({length:400},(_,i)=>+(i/4).toFixed(2));
 P('c_s2',n?[{x:t,y:sig(bad?'INNER_RACE':'SAFE',400,n),line:{color:bad?css('--alarm'):css('--accent'),width:1.1},hovertemplate:'%{x} ms<br>%{y:.3f} g<extra></extra>'}]:[],{showlegend:false,margin:{l:46,r:8,t:6,b:36},xaxis:{title:T('temps (ms)','time (ms)')},yaxis:{title:'g',range:[-3.2,3.2]}});
 P('c_s1',[{x,y:s.pts,mode:'lines+markers',line:{color:css('--accent'),width:2},marker:{size:5,color:s.pts.map(p=>p>SEUIL?css('--alarm'):css('--ok'))},name:'score'}],
  {showlegend:false,xaxis:{title:T('numéro d\'acquisition','acquisition number'),range:[0,121]},yaxis:{title:T('score (log)','score (log)'),type:'log',range:[-2.3,2.3]},
   shapes:[{type:'line',x0:0,x1:121,y0:SEUIL,y1:SEUIL,line:{color:css('--fg'),dash:'dash',width:1.2}},{type:'rect',x0:0,x1:121,y0:SEUIL,y1:200,fillcolor:css('--alarm'),opacity:.06,line:{width:0}}],
   annotations:[{x:120,y:Math.log10(SEUIL),text:T('seuil','threshold'),showarrow:false,yshift:10,xanchor:'right',font:{color:css('--muted'),size:11}}]})}
let simT=null;const simR=rng(42);
function simTick(){const s=S.sim;if(!s.run)return;const i=s.pts.length;if(i>=120){s.run=false;render();return}
 let v=.03*Math.exp(gauss(simR)*.35);if(s.sc==='deg'&&i>55)v=Math.min(60,.05*Math.exp((i-55)*.16)*Math.exp(gauss(simR)*.25));if(s.sc==='safe'&&(i===38||i===39))v=.3;
 const was=i&&s.pts[i-1]>SEUIL;s.pts.push(v);const fr=Math.max(0,Math.min(1,Math.log10(v/.05)/2.6));s.ft.push(FEATS.map(f=>f[1]+(f[2]-f[1])*fr+gauss(simR)*(f[4]-f[3])*.13));const tm='00:'+String(Math.floor((i+1)/60)).padStart(2,'0')+':'+String((i+1)%60).padStart(2,'0');
 if(v>SEUIL&&!was)s.log.unshift([tm,T('Alarme : score ','Alarm: score ')+v.toFixed(3)+T(' au-dessus du seuil',' above threshold'),'a']);
 if(v<=SEUIL&&was)s.log.unshift([tm,T('Retour à la normale','Back to normal'),'o']);
 if(location.hash.slice(1)==='surveillance'){render()}}

/* espace latent : points synthétiques + vrai k-means dans le navigateur */
function latPts(corr){const r=rng(11),cen={SAFE:[-6,0,1],BALL:[-1,4,-2],INNER_RACE:[3,-3,2],OUTER_RACE:[1,1,-4],COMBINED:[6,3,3]},sp=[[0,-7,-3],[0,0,0],[0,7,3]],pts=[];
 ETATS.forEach((e,ei)=>[10,15,20].forEach((v,vi)=>{for(let i=0;i<34;i++){const o=corr?[0,0,0]:sp[vi].map(q=>q*1.5),sc=corr?1:.55;pts.push({e,v,p:[0,1,2].map(d=>cen[e][d]*sc+o[d]+gauss(r)*(corr?.75:.5))})}}));return pts}
function kmeans(pts,k){const r=rng(3);let c=[];for(let i=0;i<k;i++)c.push(pts[Math.floor(r()*pts.length)].p.slice());let a=[];
 for(let it=0;it<14;it++){a=pts.map(q=>{let b=0,bd=1e9;c.forEach((m,j)=>{const d=(q.p[0]-m[0])**2+(q.p[1]-m[1])**2+(q.p[2]-m[2])**2;if(d<bd){bd=d;b=j}});return b});
  c=c.map((m,j)=>{const g=pts.filter((_,i)=>a[i]===j);return g.length?[0,1,2].map(d=>g.reduce((s,q)=>s+q.p[d],0)/g.length):m})}return a}

V.methodologie=()=>({html:`<p class="lead">${T('Comment Ballguard a été construit, sur quelles données, et ce qu\'il faut garder en tête en lisant ses résultats.','How Ballguard was built, on which data, and what to keep in mind when reading its results.')}</p>

${[[T('Découpage avant tout prétraitement','Split before any preprocessing'),T('70 % entraînement, 15 % validation, 15 % test, stratifié par état et vitesse. Toute normalisation est apprise sur l\'entraînement seul.','70% train, 15% validation, 15% test, stratified by state and speed. Every scaler is fitted on train only.')],
[T('Du signal aux descripteurs','From signal to features'),T('Chaque seconde de vibration est résumée par 13 descripteurs par capteur : 5 temporels et 8 bandes de fréquence.','Each second of vibration is summarised by 13 features per sensor: 5 time-domain and 8 frequency bands.')],
[T('Détection : apprendre le sain','Detection: learn what healthy looks like'),T('Un autoencodeur entraîné sur les seuls roulements sains. Un signal mal reconstruit est une anomalie.','An autoencoder trained on healthy bearings only. A poorly reconstructed signal is an anomaly.')],
[T('Corriger l\'effet de la vitesse','Correct the speed effect'),T('Passage au logarithme puis standardisation par vitesse, pour que les groupes reflètent le défaut et non la vitesse.','Log transform then per-speed scaling, so groups reflect the fault rather than the speed.')],
[T('Diagnostic : regrouper sans étiquettes','Diagnosis: group without labels'),T('k-means à 5 groupes sur l\'espace latent d\'un second autoencodeur. Les étiquettes servent seulement à nommer les groupes.','k-means with 5 groups on the latent space of a second autoencoder. Labels are only used to name the groups.')],
[T('Comparer et expliquer','Compare and explain'),T('Modèles de référence (Isolation Forest, ACP, k-means direct), décomposition de l\'erreur par descripteur et importance par permutation.','Baselines (Isolation Forest, PCA, plain k-means), per-feature error breakdown and permutation importance.')]].map((s,i)=>`<div class="s"><div class="n">${i+1}</div><div><b>${s[0]}</b><p>${s[1]}</p></div></div>`).join('')}</div></div>

/* ================= shell ================= */
function render(){const id=(location.hash.slice(1)||'accueil'),pg=PAGES.find(p=>p[0]===id)||PAGES[0];
 document.documentElement.dataset.app=S.theme;document.documentElement.lang=S.lang;
 let last='';document.getElementById('nav').innerHTML=PAGES.map(p=>{const g=p[3]();const h=(g!==last?`<div class="group">${g}</div>`:'');last=g;return h+`<a href="#${p[0]}" class="${p===pg?'on':''}">${ic(p[1])}<span>${p[2]()}</span></a>`}).join('');
 document.getElementById('modelcard').innerHTML=`<b><span class="dot"></span>${T('Modèle chargé','Model loaded')}</b>modele_final_roulements<br>scikit-learn 1.6.1 · 15/11/2026`;
 document.getElementById('crumb').textContent='Ballguard / '+pg[3]();document.getElementById('ptitle').textContent=pg[2]();
 document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===S.lang));
 document.querySelectorAll('#theme button').forEach(b=>{b.classList.toggle('on',b.dataset.t===S.theme);b.innerHTML=ic(b.dataset.t==='dark'?'moon':'sun')+(b.dataset.t==='dark'?T('Sombre','Dark'):T('Clair','Light'))});
 const v=V[pg[0]]();const el=document.getElementById('page');const sc=window.scrollY;el.innerHTML=v.html+`<div class="foot"><span>Ballguard · ${T('Maintenance prédictive des roulements','Predictive maintenance for bearings')}</span><span>${T('Maquette de navigation v2','Navigation mockup v2')}</span></div>`;
 try{v.draw()}catch(e){console.error(e)}window.scrollTo(0,sc)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.l){S.lang=d.l}else if(d.t){S.theme=d.t}else if(d.tab){const[p,i]=d.tab.split(':');S.tab[p]=+i}
 else if(d.e){S.exp.etat=d.e}else if(d.v){S.vit=+d.v;return b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}
 else if(d.c){S.lat.corr=d.c==='1'}else if(d.d){S.lat.dim=d.d}else if(d.k){S.lat.col=d.k}
 else if(d.s){S.sim.speed=+d.s;if(S.sim.run)simStart()}
 else if(b.id==='simGo'){S.sim.run=!S.sim.run;if(S.sim.run){if(S.sim.pts.length>=120){S.sim.pts=[];S.sim.log=[];S.sim.ft=[]}simStart()}else clearInterval(simT)}
 else if(b.id==='simRe'){S.sim.run=false;clearInterval(simT);S.sim.pts=[];S.sim.log=[];S.sim.ft=[]}
 else return;render()});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='selEx')S.ex=+t.value;else if(t.id==='selDesc')S.exp.desc=t.value;else if(t.id==='simSc'){S.sim.sc=t.value;S.sim.pts=[];S.sim.log=[];S.sim.ft=[];S.sim.run=false;clearInterval(simT)}else if(t.id==='lK')S.lat.k=+t.value;else return;render()});
document.addEventListener('input',e=>{if(e.target.id==='lK'){S.lat.k=+e.target.value}});
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render()});
render();
</script>
