
name: Compilation du rapport LaTeX

on:
  push:
    paths:
      - "rapport/**"
      - ".github/workflows/rapport-latex.yml"
  pull_request:
    paths:
      - "rapport/**"
      - ".github/workflows/rapport-latex.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Generer le PDF
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers du depot
        uses: actions/checkout@v4

      - name: Compiler le rapport LaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: rapport

      - name: Enregistrer le rapport PDF
        uses: actions/upload-artifact@v4
        with:
          name: Rapport-Autoencodeurs-PDF
          path: rapport/main.pdf
          if-no-files-found: error
          retention-days: 14
